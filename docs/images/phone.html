<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1280px; height: 1040px; overflow: hidden; background: #0f1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e6e8ef;
    display: flex; align-items: center; justify-content: center; gap: 90px; }
  .ph { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .frame { width: 392px; padding: 12px; border-radius: 58px; background: #2a2d36;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px #3b3f4b; }
  .frame img { display: block; width: 368px; height: 797px; border-radius: 46px; }
  .cap { font-size: 18px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .cap b { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #1f2330; border: 1px solid #2a2f3d; color: #9aa3b2; font-weight: 600; }
  .arrow { font-size: 34px; color: #6ea8fe; margin-top: -40px; }
</style></head>
<body>
  <div class="ph"><div class="frame"><img src="cap/phone-en.png" alt=""></div><div class="cap">English</div></div>
  <div class="arrow">&rarr;</div>
  <div class="ph"><div class="frame"><img src="cap/phone-zh.png" alt=""></div><div class="cap">中文 <b>one click</b></div></div>
</body></html>
